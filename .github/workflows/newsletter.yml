name: AI 뉴스레터 발송

on:
  schedule:
    - cron: '50 20 * * 1'  # 매주 화요일 05:50 KST (월요일 20:50 UTC)
    - cron: '50 20 * * 4'  # 매주 금요일 05:50 KST (목요일 20:50 UTC)
  workflow_dispatch:        # 수동 실행 (테스트용)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스레터 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          NEWSLETTER_NAME: ${{ secrets.NEWSLETTER_NAME }}
          AUTHOR_NAME: ${{ secrets.AUTHOR_NAME }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python newsletter.py

      - name: 이슈 카운터 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .issue_counter
          git diff --staged --quiet || git commit -m "chore: $(date +'%Y-%m-%d') 이슈 번호 업데이트"
          git push
