name: AI 뉴스레터 발송

on:
  schedule:
    - cron: '50 20 * * 4'  # 매주 금요일 05:50 KST (목요일 20:50 UTC)
  workflow_dispatch:        # 수동 실행 (테스트용)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스레터 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          NEWSLETTER_NAME: ${{ secrets.NEWSLETTER_NAME }}
          AUTHOR_NAME: ${{ secrets.AUTHOR_NAME }}
        run: python newsletter.py

      - name: Netlify 배포용 HTML 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --staged --quiet || git commit -m "newsletter: $(date +'%Y-%m-%d') 뉴스레터 발행"
          git push
