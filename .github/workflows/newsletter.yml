name: AI 뉴스레터 로컬 전환 안내

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  local-only-notice:
    runs-on: ubuntu-latest

    steps:
      - name: 로컬 발송 전환 안내
        run: |
          echo "GitHub Actions 자동 발송은 비활성화되었습니다."
          echo "이제 뉴스레터는 로컬에서 python newsletter.py 로 생성/검토/발송하세요."
          echo "미리보기만 필요하면 python newsletter.py --dry-run 을 사용하세요."
